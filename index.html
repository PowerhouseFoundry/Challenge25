<body><div class="shell"><header class="topbar"><img class="logo" src="assets/images/powerhouse-wordmark.png" alt="The Powerhouse"><div class="divider"></div><div class="brand"><h1>Challenge 25 Age Verification Training</h1><p>Powerhouse Bar Academy · Responsible service training</p></div><div class="c25">CHALLENGE 25</div></header><div class="redline"></div><main id="app"></main></div>
<script>
const TODAY=new Date();
const LS='c25_wired_progress_v1';
// Keep only compact training progress. Old or oversized records are safely reduced.
let state={modules:{},tests:{}};
let progressStorageAvailable=true;
function trimProgress(value){
  const clean={modules:{},tests:{}};
  if(!value || typeof value!=='object')return clean;
  for(const key of ['law','age','id']){
    if(['progress','completed'].includes(value.modules?.[key]))clean.modules[key]=value.modules[key];
  }
  for(const key of ['lawCheck','ageTest','idTest']){
    const t=value.tests?.[key];
    if(!t || typeof t!=='object')continue;
    const score=Number(t.score),total=Number(t.total);
    if(!Number.isFinite(score)||!Number.isFinite(total)||total<=0)continue;
    clean.tests[key]={score:Math.max(0,Math.min(total,Math.round(score))),total:Math.round(total),pct:Math.round(score/total*100),passed:Boolean(t.passed)};
  }
  return clean;
}
try{state=trimProgress(JSON.parse(localStorage.getItem(LS)||'{}'));}
catch(err){progressStorageAvailable=false;state={modules:{},tests:{}};}
function save(){
  state=trimProgress(state);
  try{localStorage.setItem(LS,JSON.stringify(state));progressStorageAvailable=true;return true;}
  catch(err){
    // Private browsing, file:// restrictions, and a full storage quota must not block the test.
    progressStorageAvailable=false;
    return false;
  }
}
function launchTrainingFullscreen(){
  // Must be initiated by a learner's actual button press. iPad Safari may not support this API.
  try{
    if(!document.fullscreenElement && document.documentElement.requestFullscreen){
      const request=document.documentElement.requestFullscreen({navigationUI:'hide'});
      if(request && typeof request.catch==='function')request.catch(()=>{});
    }else if(document.documentElement.webkitRequestFullscreen && !document.webkitFullscreenElement){
      document.documentElement.webkitRequestFullscreen();
    }
  }catch(err){}
}
function startTraining(id){launchTrainingFullscreen();openModule(id);}

];

const idQs=[
{name:'Mia Carter',customerImage:'assets/images/id-test-01-customer-valid.png',idImage:'assets/images/id-test-01-card-valid-over18.png',answer:'serve',why:'In this example, the approved ID has been checked, the photo matches, and the customer has been confirmed as 18 or over. Always check the actual dates yourself.'},
{name:'Leo Morris',customerImage:'assets/images/id-test-04-customer-damaged-id.png',idImage:'assets/images/id-test-04-card-damaged-photo-area.png',answer:'manager',why:'The photograph area appears damaged. Do not accept the ID without further checks. Ask a manager.'},
{name:'Amelia Fox',customerImage:'assets/images/id-test-05-customer-altered-date.png',idImage:'assets/images/id-test-05-card-altered-dob.png',answer:'manager',why:'Part of the ID looks altered. Pause the sale and ask a manager to check.'},
{name:'Olivia Reed',customerImage:'assets/images/id-test-03-customer-expired-id.png',idImage:'assets/images/id-test-03-card-expired-date.png',answer:'refuse',why:'This example shows an ID that is out of date. Check the actual expiry date when serving a real customer.'},
{name:'Ryan Green',customerImage:'assets/images/id-test-08-customer-valid-older.png',idImage:'assets/images/id-test-08-card-valid-over18.png',answer:'serve',why:'This scenario shows an acceptable, checked ID with a matching photograph. In real service, confirm the date of birth and expiry on the day.'}
];

function passed(t){return state.tests[t]&&state.tests[t].passed}
function complete(m){state.modules[m]='completed';save()}
function status(id){if(id==='cert')return passed('idTest')?'Unlocked':'Locked'; if(state.modules[id]==='completed')return 'Completed'; if(state.modules[id]==='progress')return 'In Progress'; return 'Not Started'}
function statusClass(s){return s==='Completed'?'done':s==='In Progress'?'progress':''}
function moduleDoneCount(){return ['law','age','id'].filter(m=>state.modules[m]==='completed').length}
function scoreCount(){return ['lawCheck','ageTest','idTest'].filter(passed).length}
function home(){const degrees=(scoreCount()/3)*360; document.getElementById('app').innerHTML=`<section class="screen layout"><div class="panel"><div class="hero"><div><h2>Training Dashboard</h2><p>Complete each training module before taking the tests. You need 80% to pass each check and unlock your certificate. On iPad, use Add to Home Screen to open in the largest available view.</p></div><button class="btn secondary" onclick="resetProgress()">Reset learner progress</button></div><div class="progressbar"><span style="width:${(scoreCount()/3)*100}%"></span></div><div class="cards">${modules.map(m=>{let lock=m.locked&&m.locked();let s=lock?'Locked':status(m.id);let action=m.id==='cert'?'openCertificate()':`startTraining('${m.id}')`;let btn=m.id==='cert'?'Open Certificate':s==='Completed'?'Review Module':s==='In Progress'?'Continue Module':'Start Module';return `<article class="card ${lock?'locked':''}"><img src="${m.image}" alt=""><div class="cardbody"><h3>${m.title}</h3><p>${m.desc}</p><div class="cardfooter"><span class="status ${statusClass(s)}">${s==='Completed'?'✓ ':s==='Locked'?'Locked: ':''}${s}</span><button class="btn" ${lock?'disabled':''} onclick="${action}">${btn}</button></div></div></article>`}).join('')}</div></div><aside class="panel side"><h3>Course Progress</h3><div class="ring" style="background:conic-gradient(var(--red) ${degrees}deg,#222 0)"><div>${scoreCount()}/3<br><small style="font-size:14px;color:var(--muted)">passed</small></div></div><div class="tip"><b>Training order</b><br>1. Challenge 25 & law check<br>2. Judging age test<br>3. ID checking test<br>4. Certificate</div><br><div class="tip"><b>Pass mark</b><br>All checks require 80%. If a learner scores below 80%, they are guided to try again.</div><br><button class="homebtn" onclick="showAssets()">View image list</button></aside></section>`}
function resetProgress(){if(confirm('Reset all learner progress on this device?')){try{localStorage.removeItem(LS)}catch(err){}state={modules:{},tests:{}};home()}}
let currentModule='law', slideIndex=0;
function openModule(id){currentModule=id; slideIndex=0; if(state.modules[id]!=='completed')state.modules[id]='progress'; save(); renderSlide()}
function closeModule(){home()}
function renderSlide(){let s=slides[currentModule][slideIndex]; document.getElementById('app').innerHTML=`<section class="moduleOverlay"><div class="moduleModal" role="dialog" aria-modal="true"><div class="modalTop"><div><div class="modalTitle">${modules.find(m=>m.id===currentModule)?.title||'Training module'}</div><span class="dots">Slide ${slideIndex+1} of ${slides[currentModule].length}</span></div><div class="modalActions"><button class="homebtn" onclick="closeModule()">Home</button><button class="homebtn" onclick="closeModule()" aria-label="Close module">Close</button></div></div><div class="slide"><img class="slideimg" src="${s[2]}" alt=""><div><h2>${s[0]}</h2><p>${s[1]}</p><p class="takeaway">${s[3]}</p></div></div><div class="modalBottom"><button class="btn secondary" ${slideIndex===0?'disabled':''} onclick="slideIndex--;renderSlide()">Previous</button><button class="btn" onclick="nextSlide()">${slideIndex===slides[currentModule].length-1?'Continue':'Next'}</button></div></div></section>`}
function nextSlide(){if(slideIndex<slides[currentModule].length-1){slideIndex++;renderSlide();return} if(currentModule==='law')startQuiz('lawCheck'); if(currentModule==='age'){complete('age'); startAgeTest()} if(currentModule==='id'){complete('id'); startIdTest()}}
let quizType='',qIndex=0,qScore=0;
function startQuiz(type){quizType=type;qIndex=0;qScore=0;renderLawQuiz()}
function renderLawQuiz(){let q=lawQuestions[qIndex]; document.getElementById('app').innerHTML=`<section class="quizwrap panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><button class="homebtn" onclick="home()">Home</button><span class="dots">Knowledge check ${qIndex+1} of ${lawQuestions.length}</span></div><h2 class="question">${q[0]}</h2><div id="answers" class="answers">${q[1].map((a,i)=>`<button class="answerbtn" onclick="answerLaw(${i})">${a}</button>`).join('')}</div><div id="feedback"></div></section>`}
function answerLaw(i){let q=lawQuestions[qIndex]; let ok=i===q[2]; if(ok)qScore++; document.getElementById('answers').style.display='none'; document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct':'Not quite'}</b><br>${q[3]}<br><br><button class="btn" onclick="nextLaw()">${qIndex===lawQuestions.length-1?'See result':'Next question'}</button></div>`}
function nextLaw(){qIndex++; if(qIndex<lawQuestions.length)renderLawQuiz(); else finishTest('lawCheck',qScore,lawQuestions.length,()=>{complete('law');home()})}
function startAgeTest(){qIndex=0;qScore=0;renderAge()}
function renderAge(){let q=ageQs[qIndex]; document.getElementById('app').innerHTML=`<section class="quizwrap panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><button class="homebtn" onclick="home()">Home</button><span class="dots">Age judgement ${qIndex+1} of ${ageQs.length}</span></div><div class="testgrid"><div class="person"><img class="personimg" src="${q.image}" alt="customer"><h2>Customer at the bar</h2><p style="font-size:22px;color:#ddd">${q.look}</p></div><div><h2 class="question">What should you do?</h2><div id="answers" class="answers"><button class="answerbtn red" onclick="answerAge('challenge')">Challenge</button><button class="answerbtn green" onclick="answerAge('serve')">Serve</button></div><div id="feedback"></div></div></div></section>`}
function answerAge(choice){let q=ageQs[qIndex];let ok=choice===q.answer;if(ok)qScore++;document.getElementById('answers').style.display='none';document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct decision':'Not the safest decision'}</b><br>${q.why}<br><br><button class="btn" onclick="nextAge()">${qIndex===ageQs.length-1?'See result':'Next customer'}</button></div>`}
function nextAge(){qIndex++;if(qIndex<ageQs.length)renderAge();else finishTest('ageTest',qScore,ageQs.length,()=>{home()})}
function startIdTest(){qIndex=0;qScore=0;renderId()}
function renderId(){let q=idQs[qIndex]; document.getElementById('app').innerHTML=`<section class="quizwrap panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><button class="homebtn" onclick="home()">Home</button><span class="dots">ID checking ${qIndex+1} of ${idQs.length}</span></div><div class="testgrid"><div class="person"><img class="personimg" src="${q.customerImage}" alt="customer"><h2>${q.name}</h2><p style="color:#ddd;font-size:20px">Customer asks to buy alcohol. Check the ID before deciding.</p></div><div class="idcard"><img class="idtestimg" src="${q.idImage}" alt="presented ID"><h2>Presented ID</h2><p style="color:#ddd;font-size:20px">Check the photograph and warning signs. In real service, also check dates against today.</p></div></div><h2 class="question" style="margin-top:18px">Your decision</h2><div id="answers" class="answers three"><button class="answerbtn green" onclick="answerId('serve')">Serve</button><button class="answerbtn red" onclick="answerId('refuse')">Refuse</button><button class="answerbtn" onclick="answerId('manager')">Ask Manager</button></div><div id="feedback"></div></section>`}
function answerId(choice){let q=idQs[qIndex];let ok=choice===q.answer;if(ok)qScore++;document.getElementById('answers').style.display='none';document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct decision':'Review this decision'}</b><br>${q.why}<br><br><button class="btn" onclick="nextId()">${qIndex===idQs.length-1?'See result':'Next ID check'}</button></div>`}
function nextId(){qIndex++;if(qIndex<idQs.length)renderId();else finishTest('idTest',qScore,idQs.length,()=>home())}
function finishTest(test,score,total,afterPass){let pct=Math.round(score/total*100);let ok=pct>=80;state.tests[test]={score,total,pct,passed:ok,date:new Date().toLocaleDateString('en-GB')};save();document.getElementById('app').innerHTML=`<section class="quizwrap panel"><button class="homebtn" onclick="home()">Home</button><h2 class="question">${ok?'Passed':'Try again'}</h2><p style="font-size:26px;color:#ddd">Score: <b>${score}/${total}</b> (${pct}%)</p><div class="feedback ${ok?'good':'bad'}">${ok?'Well done. This section is complete.':'You need 80% to pass. Review the training and try again.'}</div><br><button class="btn ${ok?'green':''}" onclick="finishContinue('${test}',${ok})">${ok?'Continue':'Try Again'}</button></section>`}
function finishContinue(test,ok){if(ok){if(test==='lawCheck')complete('law');home();return} if(test==='lawCheck')openModule('law'); else if(test==='ageTest')startAgeTest(); else startIdTest()}
function openCertificate(){if(!passed('idTest')){home();return}document.getElementById('app').innerHTML=`<section class="certpage panel"><div class="no-print"><button class="homebtn" onclick="home()">Home</button><h2 class="question">Generate Certificate</h2><p style="color:#ddd;font-size:20px">Enter the learner name, then print or download a saveable certificate.</p><div class="nameform"><input id="learnerName" placeholder="Learner full name"><button class="btn" onclick="renderCert()">Create Certificate</button><button class="btn secondary" onclick="downloadCert()">Download / Save HTML</button><button class="btn secondary" onclick="window.print()">Print Certificate</button></div></div><div id="cert">${certificateHTML('Learner Name')}</div></section>`}
function certificateHTML(name){let date=new Date().toLocaleDateString('en-GB');let a=state.tests.ageTest||{},i=state.tests.idTest||{},l=state.tests.lawCheck||{};return `<div class="certificate"><div class="certtop"><img class="certlogo" src="assets/images/powerhouse-wordmark.png"><div style="font-weight:1000;font-size:30px;color:#e31b23">CHALLENGE 25</div></div><div class="certtitle">Certificate of Achievement</div><div class="certsub">This certifies that</div><div class="certname">${name||'Learner Name'}</div><div class="certsub">has successfully completed<br><b>Challenge 25 Age Verification Training</b></div><div class="certgrid"><div class="certbadge">Law Check<br>${l.pct||0}%</div><div class="certbadge">Age Judgement<br>${a.pct||0}%</div><div class="certbadge">ID Checking<br>${i.pct||0}%</div><div class="certbadge">Date<br>${date}</div></div><p class="certsub">Training included Challenge 25, legal responsibilities, proxy sales, acceptable ID, fake ID warning signs and responsible refusal.</p><div class="signature"><div class="sigline">West SILC Powerhouse</div><div class="sigline">Trainer Signature</div></div></div>`}
function renderCert(){let n=document.getElementById('learnerName').value.trim();document.getElementById('cert').innerHTML=certificateHTML(n||'Learner Name')}
function downloadCert(){let n=(document.getElementById('learnerName')?.value||'Learner Name').trim();let style=document.querySelector('style').innerHTML;let html='<!doctype html><html><head><meta charset="utf-8"><title>Challenge 25 Certificate</title><style>'+style+'</style></head><body><div class="certpage">'+certificateHTML(n)+'</div></body></html>';let blob=new Blob([html],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='challenge-25-certificate.html';a.click();URL.revokeObjectURL(a.href)}
function allImageFiles(){return Object.values(img).concat(ageQs.map(q=>q.image)).concat(idQs.flatMap(q=>[q.customerImage,q.idImage]));}
function showAssets(){let files=[...new Set(allImageFiles())].sort();document.getElementById('app').innerHTML=`<section class="screen panel"><button class="homebtn" onclick="home()">Home</button><h2 class="question">Finished image files used by this app</h2><p style="color:#ddd;font-size:20px">These are the finished image files currently used in the app. No replacement artwork is required.</p><div class="assetlist">${files.map(f=>`<div><code>${f.replace('assets/images/','')}</code></div>`).join('')}</div></section>`}
home();
</script></body></html>
